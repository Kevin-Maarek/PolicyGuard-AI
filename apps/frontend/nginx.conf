server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        proxy_pass http://policyguard-api:8000/;
        proxy_read_timeout 650s;
    }
    location /mock/internal/rules/ {
        proxy_pass http://sas-mock:8000/internal/rules/;
        proxy_set_header X-Mock-Admin-Token "${MOCK_ADMIN_TOKEN}";
        proxy_read_timeout 30s;
    }
    location /mock/ {
        proxy_pass http://sas-mock:8000/;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
